name: Nix Diff
on:
  pull_request:
jobs:
  nix-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3
      - name: Diff Nix packages
        uses: natsukium/nix-diff-action@v1.2.0
        with:
          attributes: |
            - displayName: eve24
              attribute: darwinConfigurations.eve24.system
            - displayName: chocolate
              attribute: nixosConfigurations.chocolate.config.system.build.toplevel
            - displayName: hyper-nixos
              attribute: nixosConfigurations.hyper-nixos.config.system.build.toplevel
