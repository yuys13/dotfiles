name: Nix Diff
on:
  pull_request:
jobs:
  nix-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Diff Nix packages
        uses: natsukium/nix-diff-action@4091452e4c7b3c7ea4ecbaec84be7f0066d810d7 # v1.1.1
        with:
          attributes: |
            - displayName: eve24
              attribute: darwinConfigurations.eve24.system
            - displayName: chocolate
              attribute: nixosConfigurations.chocolate.config.system.build.toplevel
            - displayName: hyper-nixos
              attribute: nixosConfigurations.hyper-nixos.config.system.build.toplevel
